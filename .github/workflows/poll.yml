name: poll launches

# Every 10 minutes, 24/7 — the point of moving this off the laptop.
#
# WHY THIS CADENCE. GeckoTerminal's new_pools feed only reaches back ~53
# minutes, so a slow poll does not "catch up" — it loses launches permanently.
# 10 minutes gives roughly 6 observations per pool in its first hour, which is
# what the delta-based rug detection needs. Actions cron has a 5-minute floor
# and routinely runs late under load, so treat 10 as a target, not a guarantee;
# the poller's own gap check reports when the window was missed.
#
# The two API calls here are key-free (GeckoTerminal) plus one public RPC call
# for the NFT mint scan, so this workflow needs no secrets at all.
# Cron says every 10 minutes; GitHub DELIVERS roughly hourly. Measured run
# starts: 12:05, 13:38, 14:40, 15:39, 16:31 — scheduled workflows on free
# runners are throttled and queued, and sub-hourly cadence is not honoured.
#
# So the schedule fires hourly and the JOB ITSELF loops, polling every 3 minutes
# for ~55 minutes. One trigger, ~18 observations per hour instead of 1. This is
# the only way to get fine-grained sampling out of Actions, and it is free on a
# public repo.
on:
  schedule:
    - cron: "4 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-ledger
  cancel-in-progress: false      # never drop an observation to a newer run

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      # Commits every 5th poll (~15 min) rather than once at the end. The job
      # runs for ~55 minutes; committing only on completion means a timeout,
      # cancellation or runner eviction loses the whole hour — and these
      # observations cannot be reconstructed, because the upstream feed only
      # exposes the last ~53 minutes.
      - name: Poll on a loop
        run: |
          git config user.name  "hoodscout-bot"
          git config user.email "bot@hoodscout.local"
          END=$(( $(date +%s) + 55*60 ))
          N=0
          save() {
            git add -f out/launches.jsonl out/nft_launches.jsonl out/nft_registry.json 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "ledger: $(date -u '+%Y-%m-%dT%H:%MZ') [skip ci]"
            git pull --rebase --autostash -q origin main || true
            # ⚠️ A swallowed push failure hid a two-day outage. out/nft_registry.json
            # grew past GitHub's 100 MB hard limit on 2026-08-22; every push was
            # rejected, `|| true` reported success, and the daily refresh kept
            # building the site from frozen ledgers -- Memecoin vitals and NFT
            # launches both rendered their "warming up" empty state the whole time.
            #
            # Still non-fatal (a lost push is recoverable next cycle, and killing
            # the job would lose the observations in flight) but it must be LOUD
            # and it must fail the step's annotation so it shows up in the run list.
            if ! git push -q; then
              echo "::error title=ledger push rejected::git push failed — the ledger is NOT reaching origin. Check file sizes against GitHub's 100 MB limit:"
              du -m out/*.json out/*.jsonl 2>/dev/null | sort -rn | head -5
              PUSH_FAILED=1
            fi
          }
          while [ "$(date +%s)" -lt "$END" ]; do
            # ⚠️ 1 day, not 2, and not 7. This number has now caused TWO outages.
          # The 7 -> 2 change came after the ledger hit 115.28 MB, past GitHub's
          # 100 MB HARD limit, blocking every push including this workflow's own.
          # Two days was ~30 MB then. At 2026-08-24 launch volume it is 95 MB --
          # five points from the same failure again.
          #
          # One day is sufficient, not a compromise: load_launch_traces reads at
          # most a 24h window (`for _win in (6, 12, 24)`), so the second day was
          # weight no reader ever asked for. This also prunes nft_registry.json,
          # which was never pruned at all and is what actually broke on 08-22.
          #
          # ⚠️ Rows dropped here are NOT recoverable from upstream. The durable
          # fix is slimmer rows -- one row per pool per observation carries
          # repeated immutable fields -- not a smaller number next time.
          python3 launch_watch.py --prune-days 1 || true
            N=$((N+1))
            [ $((N % 5)) -eq 0 ] && save
            [ "$(date +%s)" -lt "$END" ] && sleep 180
          done
          save
          echo "completed $N polls this hour"
          if [ "${PUSH_FAILED:-0}" = "1" ]; then
            echo "::warning::at least one ledger push was rejected this run"
          fi

      # (committing happens inside the loop above so a lost runner costs
      #  at most ~15 minutes of observations, not the whole hour)
