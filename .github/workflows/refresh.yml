name: daily refresh

# The full pull + render + deploy, once a day at 09:00 UTC.
#
# 09:00 UTC is deliberate, not arbitrary: every headline on the page is keyed to
# the last complete UTC day, and Blockscout publishes a calendar-complete bucket
# hours before it stops filling. Nine hours past UTC midnight is the margin that
# stops a partial day being reported as finished.
#
# This replaces the launchd job that ran on Dave's laptop, which fired late on
# wake and once wrote a pulse with null stats because the network was not up.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests eth-abi eth-hash[pycryptodome] pillow

      - name: Pull chain data
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        # chain_pulse exits non-zero and keeps the previous pulse.json if core
        # stats are missing, so a bad upstream cannot publish a zeroed page.
        run: python3 chain_pulse.py

      - name: Cross-check against Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        continue-on-error: true      # a Dune outage must not block the refresh
        run: python3 verify_dune.py --days 10

      - name: Render
        # --public drops the noindex guard. The site was a staging surface
        # until launch; it is meant to be found now.
        run: python3 build_dashboard.py --base-url https://hoodscout.pages.dev --public

      - name: Render social card
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || true
          BIN=$(command -v chromium-browser || command -v chromium || echo "")
          if [ -n "$BIN" ]; then
            "$BIN" --headless --disable-gpu --no-sandbox --hide-scrollbars \
              --virtual-time-budget=5000 --window-size=1200,630 \
              --screenshot=out/site/card.png "file://$PWD/out/site/card.html"
          else
            echo "no chromium; keeping the previous card.png"
          fi

      # Cloudflare Pages is connected to this repo and deploys on push, so the
      # built site is committed rather than uploaded. That removes the need for
      # a Cloudflare API token from the pipeline entirely.
      #
      # NOTE: no [skip ci] here — this commit is exactly what should trigger a
      # Pages deploy. The ledger commits in poll.yml keep [skip ci] so routine
      # observations do not redeploy the site.
      - name: Commit built site
        run: |
          git config user.name  "hoodscout-bot"
          git config user.email "bot@hoodscout.local"
          # ⚠️ The registries are committed, not just the rendered site. Both
          # wage_pools.json and launchpad_tokens.json are CONVERGENCE state:
          # each run measures what its budget allows, stores a watermark, and
          # resumes there next time. A runner starts from a fresh checkout, so
          # a registry left uncommitted is a registry that resets every night --
          # the budgets would never converge and the same early pools would be
          # re-measured from block 0 forever.
          git add -f out/site out/nft_names.json out/nft_registry.json \
                     out/wage_pools.json out/launchpad_tokens.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "refresh: $(date -u '+%Y-%m-%d %H:%MZ')"
            git pull --rebase --autostash origin main || true
            git push
          fi
